<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saint-Crown Staff Review</title>
<style>
:root{color-scheme:dark;--bg:#090909;--panel:#151515;--line:#343434;--gold:#caa35d;--muted:#aaa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f1e8;font:16px/1.5 Arial,sans-serif}
main{max-width:900px;margin:0 auto;padding:32px 18px 70px}.brand{color:var(--gold);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:13px}
h1{font-size:32px;margin:10px 0 4px}.muted{color:var(--muted)}.panel,.application{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin:18px 0}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:8px;background:#080808;color:white;font-size:16px}
button{border:0;border-radius:8px;padding:12px 17px;background:var(--gold);color:#17130b;font-weight:700;cursor:pointer;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:12px 0}.field{font-size:14px}.field b{color:var(--muted);font-weight:400;display:block;font-size:12px}
.application h2{font-size:19px;margin:0}.application .meta{color:var(--muted);font-size:13px}.application button{margin-right:8px}
video{width:100%;max-height:520px;margin-top:14px;background:#000;border-radius:10px}
#message{margin-top:10px;color:var(--muted);white-space:pre-wrap}
</style>
</head>
<body><main>
<div class="brand">Saint-Crown Recruiting</div><h1>Staff application review</h1>
<p class="muted">Private staff workspace. Athlete information and footage are only loaded after staff authentication.</p>
<section class="panel">
<label for="staffToken">Staff access token</label><input id="staffToken" type="password" autocomplete="current-password" placeholder="Enter staff access token">
<button id="load">Unlock applications</button><div id="message" role="status"></div>
</section>
<nav class="panel" aria-label="Staff sections" style="display:flex;gap:10px;flex-wrap:wrap"><button id="applicationsTab" type="button" aria-pressed="true">Applications</button><button id="approvedTab" type="button" aria-pressed="false">Approved Athletes</button><button id="bookingsTab" type="button" aria-pressed="false">Call Bookings</button></nav>
<section id="applications" aria-live="polite"></section>
<section id="approvedAthletes" aria-live="polite" hidden></section>
<section id="callBookings" aria-live="polite" hidden></section>
<section id="playerPanel" hidden><h2 id="playerTitle">Private athlete video</h2><video id="player" controls playsinline></video></section>
</main>
<script>
let staffToken="",activeVideoUrl="";
const message=document.getElementById("message"),list=document.getElementById("applications"),approvedList=document.getElementById("approvedAthletes"),bookingsList=document.getElementById("callBookings"),player=document.getElementById("player"),playerPanel=document.getElementById("playerPanel");
function showStaffTab(tab){
 const approved=tab==="approved",bookings=tab==="bookings";
 list.hidden=approved||bookings;approvedList.hidden=!approved;bookingsList.hidden=!bookings;
 document.getElementById("applicationsTab").setAttribute("aria-pressed",String(!approved&&!bookings));
 document.getElementById("approvedTab").setAttribute("aria-pressed",String(approved));
 document.getElementById("bookingsTab").setAttribute("aria-pressed",String(bookings));
}
document.getElementById("applicationsTab").addEventListener("click",()=>showStaffTab("applications"));
document.getElementById("approvedTab").addEventListener("click",()=>showStaffTab("approved"));
document.getElementById("bookingsTab").addEventListener("click",()=>showStaffTab("bookings"));
function field(label,value){const el=document.createElement("div");el.className="field";const b=document.createElement("b");b.textContent=label;el.append(b,document.createTextNode(value==null||value===""?"—":String(value)));return el}
function showMessage(value){message.textContent=value}
document.getElementById("load").addEventListener("click",async()=>{
 staffToken=document.getElementById("staffToken").value.trim();
 if(!staffToken){showMessage("Enter your staff token.");return}
 showMessage("Loading staff information…");list.replaceChildren();approvedList.replaceChildren();bookingsList.replaceChildren();showStaffTab("applications");playerPanel.hidden=true;
 try{
  const response=await fetch("/api/staff-applications",{headers:{Authorization:"Bearer "+staffToken},cache:"no-store"});
  const data=await response.json();if(!response.ok)throw new Error(data.error||"Could not authenticate.");
  const bookingResponse=await fetch("/api/bookings?staff=1",{headers:{Authorization:"Bearer "+staffToken},cache:"no-store"});
  const bookingData=await bookingResponse.json();if(!bookingResponse.ok)throw new Error(bookingData.error||"Could not load call bookings.");
  const callBookings=bookingData.bookings||[];
  const agreements=data.agreements||[];const approvedContacts=data.approvedContacts||[];
  if(!data.applications.length&&!agreements.length&&!approvedContacts.length){showMessage("No applications, approved athlete contacts or signed agreements yet.");return}
  showMessage(data.applications.length+" application(s), "+approvedContacts.length+" approved athlete contact(s), "+agreements.length+" signed agreement(s) and "+callBookings.length+" call booking(s) loaded.");
  for(const app of data.applications){
   const card=document.createElement("article");card.className="application";
   const title=document.createElement("h2");title.textContent=app.name+" · "+app.level;
   const meta=document.createElement("div");meta.className="meta";meta.textContent=new Date(app.createdAt).toLocaleString();
   const grid=document.createElement("div");grid.className="grid";
   [["Age",app.age||"—"],["Grad year",app.grad],["Position",app.position],["Height",app.height],["Weight",app.weight ? app.weight+" lbs" : "—"],["60-yard dash",app.sixtyYardDash ? app.sixtyYardDash+" sec" : "—"],["School",app.school],["GPA",app.gpa],["Plan",app.plan],["Recruiting status",app.status],["Athlete email",app.email],["Parent email",app.parentEmail],["Parent consent",app.parentConsent?"Yes":"No"],["Instagram",app.instagram||"—"],["Twitter / X",app.twitter||"—"],["Video uploads",(app.videos||[]).length|| (app.hasVideo?1:0)]].forEach(([k,v])=>grid.append(field(k,v)));
   card.append(title,meta,grid);
   const videos=app.videos||[];
   if(videos.length){
    videos.forEach((video,i)=>{
     const watch=document.createElement("button");watch.textContent="Watch video "+(i+1)+(video.name?" · "+video.name:"");
     watch.addEventListener("click",async()=>{
      showMessage("Loading private video "+(i+1)+"…");
      try{
       const r=await fetch("/api/staff-video?applicationId="+encodeURIComponent(app.id)+"&videoId="+encodeURIComponent(video.id),{headers:{Authorization:"Bearer "+staffToken},cache:"no-store"});
       if(!r.ok)throw new Error("Video could not be retrieved.");
       const blob=await r.blob();if(activeVideoUrl)URL.revokeObjectURL(activeVideoUrl);
       activeVideoUrl=URL.createObjectURL(blob);player.src=activeVideoUrl;
       document.getElementById("playerTitle").textContent="Private video "+(i+1)+": "+app.name;
       playerPanel.hidden=false;playerPanel.scrollIntoView({behavior:"smooth"});showMessage("Private video loaded for staff review.");
      }catch(e){showMessage(e.message)}
     });card.append(watch);
    });
   } else if(app.hasVideo){
    const watch=document.createElement("button");watch.textContent="Watch private video";
    watch.addEventListener("click",async()=>{
     showMessage("Loading private video…");
     try{const r=await fetch("/api/staff-video?applicationId="+encodeURIComponent(app.id),{headers:{Authorization:"Bearer "+staffToken},cache:"no-store"});if(!r.ok)throw new Error("Video could not be retrieved.");const blob=await r.blob();if(activeVideoUrl)URL.revokeObjectURL(activeVideoUrl);activeVideoUrl=URL.createObjectURL(blob);player.src=activeVideoUrl;document.getElementById("playerTitle").textContent="Private video: "+app.name;playerPanel.hidden=false;playerPanel.scrollIntoView({behavior:"smooth"});showMessage("Private video loaded for staff review.");}catch(e){showMessage(e.message)}
    });card.append(watch);
   }

   const remove=document.createElement("button");remove.textContent="Delete test application";remove.style.background="#8b2929";remove.style.color="#fff";
   remove.addEventListener("click",async()=>{
    if(!confirm("Permanently delete this application and its uploaded private video, if any? This cannot be undone."))return;
    remove.disabled=true;showMessage("Deleting application…");
    try{
     const r=await fetch("/api/staff-delete-application",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+staffToken},body:JSON.stringify({applicationId:app.id})});
     const result=await r.json();if(!r.ok)throw new Error(result.error||"Could not delete application.");
     card.remove();showMessage("Application deleted.");
    }catch(e){remove.disabled=false;showMessage(e.message||"Could not delete application.");}
   });card.append(remove);
   list.append(card);
  }
  for(const contact of approvedContacts){
   const card=document.createElement("article");card.className="application";
   const title=document.createElement("h2");title.textContent=contact.name+" · Approved athlete inquiry";
   const meta=document.createElement("div");meta.className="meta";meta.textContent="Received "+new Date(contact.createdAt).toLocaleString();
   const grid=document.createElement("div");grid.className="grid";
   [["Name",contact.name],["Email",contact.email],["Phone",contact.phone]].forEach(([k,v])=>grid.append(field(k,v)));
   card.append(title,meta,grid);approvedList.append(card);
  }
  if(!callBookings.length){bookingsList.append(field("Call bookings","No calls have been booked yet."));}
  const now=Date.now();
  const sortedBookings=[...callBookings].sort((a,b)=>new Date(a.startsAt)-new Date(b.startsAt));
  for(const booking of sortedBookings){
   const start=new Date(booking.startsAt),end=new Date(booking.endsAt),past=start.getTime()<now;
   const card=document.createElement("article");card.className="application";
   const title=document.createElement("h2");title.textContent=booking.name+" · "+(past?"Past call":"Upcoming call");
   const meta=document.createElement("div");meta.className="meta";
   meta.textContent=new Intl.DateTimeFormat("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit",timeZone:"America/Chicago",timeZoneName:"short"}).format(start)+" · 30 minutes";
   const grid=document.createElement("div");grid.className="grid";
   const guestTime=new Intl.DateTimeFormat("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit",timeZone:booking.guestTimezone,timeZoneName:"short"}).format(start);
   [["Athlete / Contact",booking.name],["Email",booking.email],["Phone",booking.phone],["Central time",meta.textContent],["Guest's local time",guestTime],["Time zone",booking.guestTimezone],["Booked on",new Date(booking.createdAt).toLocaleString()]].forEach(([k,v])=>grid.append(field(k,v)));
   const actions=document.createElement("div");actions.style.display="flex";actions.style.gap="8px";actions.style.flexWrap="wrap";
   const email=document.createElement("a");email.href="mailto:"+encodeURIComponent(booking.email);email.textContent="Email contact";email.style.color="#caa35d";email.style.padding="10px 0";
   const phone=document.createElement("a");phone.href="tel:"+booking.phone.replace(/[^+\\d]/g,"");phone.textContent="Call contact";phone.style.color="#caa35d";phone.style.padding="10px 0";
   actions.append(email,phone);card.append(title,meta,grid,actions);bookingsList.append(card);
  }
  for(const a of agreements){
   const card=document.createElement("article");card.className="application";
   const title=document.createElement("h2");title.textContent=a.athleteName+" · "+a.planName;
   const meta=document.createElement("div");meta.className="meta";meta.textContent="Signed "+new Date(a.signedAt).toLocaleString()+" · "+a.id;
   card.append(title,meta);list.append(card);
  }
 }catch(e){staffToken="";showMessage(e.message||"Unable to load applications.");}
});
window.addEventListener("beforeunload",()=>{if(activeVideoUrl)URL.revokeObjectURL(activeVideoUrl)});
</script></body></html>
